spring.application.name=ZelaBairro-API

# Porta: o Render informa a porta pela variavel PORT
server.port=${PORT:8080}

# Banco Oracle - credenciais SEMPRE por variavel de ambiente (nunca no codigo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Pool pequeno: o Oracle da FIAP limita conexoes simultaneas por usuario
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ZelaBairroPool

# Origens liberadas no CORS, separadas por virgula
# (ex.: http://localhost:5173,https://zelabairro.vercel.app)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# API de IA (Flask). Vazia = a ocorrencia nasce sem previsao (RN12)
app.ia.url=${IA_API_URL:}
app.ia.timeout-ms=${IA_TIMEOUT_MS:4000}

# Fotos (RN18): ate 2 MB por arquivo
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=7MB

# Erros: sempre o JSON do handler, nunca pagina HTML nem stack trace
spring.mvc.problemdetails.enabled=false
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# JSON na mesma ordem dos campos do DTO (o Jackson 3 ordena alfabeticamente por padrao)
spring.jackson.mapper.sort-properties-alphabetically=false
